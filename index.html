<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact form</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="card">
    <h1>Contact us</h1>
    <p>Complete the form below.</p>

    <!-- IMPORTANT:
      Replace the placeholder attributes below with the exact Form Attributes
      copied from your published Salesforce Form Handler.
      Do not invent or modify Salesforce-generated values.
    -->
    <form id="MCIKE2NJIRQBBQDAJN4NBA4Y5JOU" class="lead-form" data-uma-forms="true" method="post">
      <!-- Paste exact Salesforce Form Attributes into this opening form tag. -->

      <label for="firstName">First name</label>
      <input id="firstName" name="firstname" autocomplete="given-name" required>

      <label for="lastName">Last name</label>
      <input id="lastName" name="lastname" autocomplete="family-name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label class="consent">
        <input type="checkbox" name="marketing_opt_in">
        I agree to receive marketing communications.
      </label>

      <button type="submit">Submit</button>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <!-- Paste the exact Salesforce Form Handler Tracking Script here,
       usually immediately before </body>. -->
  <script async src="https://ascottbdspokehub--mcn.sandbox.my.site.com/lp/assets/scripts/external-form-handler-host.min.js" onload="SFDCFormHandler.init('https://ascottbdspokehub--mcn.sandbox.my.site.com/lp')"></script>
  <script src="app.js"></script>
</body>
</html>
